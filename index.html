<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemini API Test</title>

<style>
body {
    font-family: sans-serif;
    max-width: 800px;
    margin: 20px auto;
    padding: 10px;
}

button {
    font-size: 18px;
    padding: 10px 20px;
}

pre {
    white-space: pre-wrap;
    background: #f0f0f0;
    padding: 10px;
    border-radius: 8px;
}
</style>
</head>
<body>

<h2>Gemini APIテスト</h2>

<button id="btn">Geminiへ送信</button>

<h3>結果</h3>
<pre id="result">未実行</pre>

<script>

const API_KEY = "ここにGeminiのAPIキー";

document.getElementById("btn").addEventListener("click", testGemini);

async function testGemini() {

    const result = document.getElementById("result");

    result.textContent = "通信中...";

    try {

        const response = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    contents: [{
                        parts: [{
                            text: "こんにちは。自己紹介を50文字以内でしてください。"
                        }]
                    }]
                })
            }
        );

        const data = await response.json();

        console.log(data);

        if (data.error) {
            result.textContent =
                "エラー:\n" +
                JSON.stringify(data.error, null, 2);
            return;
        }

        result.textContent =
            data.candidates[0].content.parts[0].text;

    } catch (err) {

        result.textContent =
            "通信エラー:\n" + err;

    }
}

</script>

</body>
</html>
