<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ブロック崩し</title>

<style>
body{
    margin:0;
    background:#222;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    touch-action:none;
}

canvas{
    background:#000;
    border:2px solid white;
    max-width:100vw;
    max-height:100vh;
}

#info{
    position:absolute;
    top:10px;
    color:white;
    font-family:sans-serif;
}
</style>
</head>
<body>

<div id="info">スコア: <span id="score">0</span></div>
<canvas id="game" width="400" height="600"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreElem = document.getElementById("score");

let score = 0;

// ボール
const ball = {
    x: 200,
    y: 400,
    r: 8,
    dx: 4,
    dy: -4
};

// パドル
const paddle = {
    w: 100,
    h: 12,
    x: 150,
    y: 560
};

// ブロック
const rows = 5;
const cols = 6;
const blockWidth = 58;
const blockHeight = 20;
const padding = 5;

const blocks = [];

for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
        blocks.push({
            x: c * (blockWidth + padding) + 10,
            y: r * (blockHeight + padding) + 50,
            w: blockWidth,
            h: blockHeight,
            alive: true
        });
    }
}

function drawBall(){
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
    ctx.fillStyle = "white";
    ctx.fill();
}

function drawPaddle(){
    ctx.fillStyle = "#4CAF50";
    ctx.fillRect(
        paddle.x,
        paddle.y,
        paddle.w,
        paddle.h
    );
}

function drawBlocks(){
    blocks.forEach(block=>{
        if(block.alive){
            ctx.fillStyle = "#ff9800";
            ctx.fillRect(
                block.x,
                block.y,
                block.w,
                block.h
            );
        }
    });
}

function collision(){
    // 壁
    if(ball.x + ball.r > canvas.width ||
       ball.x - ball.r < 0){
        ball.dx *= -1;
    }

    if(ball.y - ball.r < 0){
        ball.dy *= -1;
    }

    // パドル
    if(
        ball.y + ball.r > paddle.y &&
        ball.x > paddle.x &&
        ball.x < paddle.x + paddle.w &&
        ball.dy > 0
    ){
        ball.dy *= -1;
    }

    // ゲームオーバー
    if(ball.y > canvas.height){
        alert("ゲームオーバー");
        location.reload();
    }

    // ブロック
    blocks.forEach(block=>{
        if(
            block.alive &&
            ball.x > block.x &&
            ball.x < block.x + block.w &&
            ball.y > block.y &&
            ball.y < block.y + block.h
        ){
            block.alive = false;
            ball.dy *= -1;
            score++;
            scoreElem.textContent = score;

            if(score === rows * cols){
                alert("クリア！");
                location.reload();
            }
        }
    });
}

function update(){
    ball.x += ball.dx;
    ball.y += ball.dy;

    collision();
}

function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    drawBlocks();
    drawBall();
    drawPaddle();
}

function gameLoop(){
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// タッチ操作
canvas.addEventListener("touchmove", e=>{
    e.preventDefault();

    const rect = canvas.getBoundingClientRect();
    const touch = e.touches[0];

    let x = touch.clientX - rect.left;

    paddle.x = x - paddle.w / 2;

    if(paddle.x < 0) paddle.x = 0;
    if(paddle.x + paddle.w > canvas.width){
        paddle.x = canvas.width - paddle.w;
    }
},{passive:false});

// PC用
canvas.addEventListener("mousemove", e=>{
    const rect = canvas.getBoundingClientRect();
    let x = e.clientX - rect.left;

    paddle.x = x - paddle.w/2;

    if(paddle.x < 0) paddle.x = 0;
    if(paddle.x + paddle.w > canvas.width){
        paddle.x = canvas.width - paddle.w;
    }
});

gameLoop();
</script>

</body>
</html>
